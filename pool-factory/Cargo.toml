[package]
name = "pool-factory"
version = "1.0.0"
authors = ["Blend Capital <gm@blend.capital>"]
license = "AGPL-3.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]
certora = []

[dependencies]
soroban-sdk = { workspace = true }
nondet = { workspace = true }
certora = { workspace = true }
certora-soroban = { workspace = true }
certora-soroban-macros = { workspace = true }
paste = "1.0.5"


[dev_dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
rand = {version = "0.7.3"}
